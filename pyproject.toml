[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "file-manager"
version = "0.1.0"
description = "Sorts loose files into a numbered NN_Category folder tree, using an AI model of your choice."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
organize = "file_manager.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
